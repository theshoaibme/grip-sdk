[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grip-core"
version = "0.3.0"
description = "Core shared protocols, models, and validation for Grip Platform"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "theshoaib", email = "shoaib@theshoaib.me" }]

dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
