[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grip-sdk"
version = "0.3.4"
description = "Official Python SDK for Grip AI (https://grip.theshoaib.me/) — Lightning-fast AI Search, live SSE streaming, and conversational agent sessions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "theshoaib", email = "shoaib@theshoaib.me" }
]
keywords = [
    "grip",
    "grip-sdk",
    "ai-search",
    "search-engine",
    "multi-agent",
    "streaming",
    "sse",
    "google-ai",
    "openai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.33.0",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://grip.theshoaib.me/"
Documentation = "https://github.com/theshoaibme/grip-sdk#readme"
Repository = "https://github.com/theshoaibme/grip-sdk"
Issues = "https://github.com/theshoaibme/grip-sdk/issues"

[project.scripts]
grip = "grip.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
google_ai_search = ["templates/*.html", "server/templates/*.html", "prompts/*.md"]
