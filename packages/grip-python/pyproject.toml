[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grip-sdk"
version = "0.3.3"
description = "Python client SDK for Grip Platform (https://grip.theshoaib.me/)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "theshoaib", email = "shoaib@theshoaib.me" }]

dependencies = [
    "requests>=2.33.0",
    "python-dotenv>=1.2.2",
]



[project.scripts]
grip = "grip.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
