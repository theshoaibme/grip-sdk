[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core"
version = "0.3.4"
description = "Core shared protocols, models, validation, and browser search engine for the Grip Platform"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "theshoaib", email = "shoaib@theshoaib.me" }]

dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "google_ai_search*"]

[tool.setuptools.package-data]
google_ai_search = ["templates/*.html", "server/templates/*.html"]
