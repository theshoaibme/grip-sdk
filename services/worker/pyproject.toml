[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grip-worker"
version = "0.3.0"
description = "Grip Platform Background Task Worker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grip-core",
    "grip-engine",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
