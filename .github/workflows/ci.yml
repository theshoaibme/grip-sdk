name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies and platform packages
        run: |
          python -m pip install --upgrade pip setuptools wheel build pytest httpx fastapi uvicorn pydantic
          pip install -r requirements.txt || true
          pip install -e packages/grip-core -e packages/grip-python -e engine -e services/api -e services/worker

      - name: Run Pre-Release Health Check
        run: |
          python scripts/release_check.py

      - name: Run Test Suite
        run: |
          PYTHONPATH=".:packages/grip-core/src:packages/grip-python/src:engine/src" pytest -v tests/ packages/grip-python/tests/
